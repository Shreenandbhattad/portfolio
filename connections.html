<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>connections · nerds · Shreenand Bhattad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔗</text></svg>">
<link rel="stylesheet" href="style.css">
<style>
main{max-width:560px}
.gamehead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.newbtn{border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:999px;padding:6px 14px;
  font-family:var(--sans);font-size:.78rem;cursor:pointer;transition:all .25s}
.newbtn:hover{color:var(--ink);border-color:var(--faint)}
body.night .newbtn{border-color:rgba(255,255,255,.16);color:#a8a49b}

.foundrow{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px;border-radius:12px;
  padding:14px 10px;text-align:center;opacity:0;transform:scale(.9);animation:foundin .4s ease forwards}
@keyframes foundin{to{opacity:1;transform:scale(1)}}
.foundrow .flabel{grid-column:1/-1;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;margin-bottom:2px}
.foundrow .fword{font-size:.82rem;font-weight:700}
.foundrow.g0{background:var(--tile-3)}
.foundrow.g1{background:var(--tile-4)}
.foundrow.g2{background:var(--tile-2)}
.foundrow.g3{background:var(--tile-5)}
.foundrow.g0,.foundrow.g0 *{color:var(--tile-3-ink)}
.foundrow.g1,.foundrow.g1 *{color:var(--tile-4-ink)}
.foundrow.g2,.foundrow.g2 *{color:var(--tile-2-ink)}
.foundrow.g3,.foundrow.g3 *{color:var(--tile-5-ink)}

.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:18px}
.tile{aspect-ratio:1.4;border-radius:10px;background:#f1ede4;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;
  font-family:var(--sans);font-weight:700;font-size:.78rem;letter-spacing:.01em;cursor:pointer;
  transition:transform .12s ease,background .2s ease,border-color .2s ease;user-select:none;
  color:var(--ink)}
.tile:hover{border-color:var(--faint);transform:translateY(-1px)}
.tile.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tile.wrong{animation:shake .4s ease}
.tile.gone{visibility:hidden}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
body.night .tile{background:#2e3345;border-color:rgba(255,255,255,.14);color:#e8e6e0}
body.night .tile.sel{background:#e8e6e0;color:#232838;border-color:#e8e6e0}

.controls2{display:flex;justify-content:center;gap:10px;margin-bottom:6px}
.actbtn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:9px 20px;
  font-family:var(--sans);font-weight:600;font-size:.82rem;cursor:pointer;transition:all .2s}
.actbtn:hover:not(:disabled){background:var(--ink);color:var(--paper)}
.actbtn:disabled{opacity:.35;cursor:default}
body.night .actbtn{border-color:#e8e6e0;color:#e8e6e0}
body.night .actbtn:hover:not(:disabled){background:#e8e6e0;color:#232838}

.mistakes{text-align:center;font-size:.8rem;color:var(--soft);margin-bottom:16px;display:flex;justify-content:center;gap:6px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:background .3s}
.dot.used{background:#c25562}

.msg{text-align:center;font-size:.95rem;font-weight:600;margin:20px 0;opacity:0;transition:opacity .3s}
.msg.show{opacity:1}
.msg.win{color:#5a8a52}
.msg.lose{color:#c25562}
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<nav>
  <a class="home" href="index">Shreenand</a>
  <div class="pages">
    <a href="about">about</a>
    <a href="work">work</a>
    <a href="projects">projects</a>
    <a href="play">play</a>
    <a href="guestbook">guestbook</a>
    <a href="contact">say hi</a>
  </div>
</nav>

<main>
  <div class="gamehead">
    <div>
      <h1 class="page fade in">connections</h1>
      <p class="sub fade in" style="margin-bottom:0">find the four groups of four.</p>
    </div>
    <button class="newbtn" id="newBtn">🔀 new puzzle</button>
  </div>

  <div id="foundArea"></div>
  <div class="board" id="board"></div>

  <div class="mistakes" id="mistakesRow">
    mistakes remaining <span class="dot" id="d0"></span><span class="dot" id="d1"></span><span class="dot" id="d2"></span><span class="dot" id="d3"></span>
  </div>

  <div class="controls2">
    <button class="actbtn" id="shuffleBtn">shuffle</button>
    <button class="actbtn" id="deselectBtn">deselect all</button>
    <button class="actbtn" id="submitBtn">submit</button>
  </div>

  <div class="msg" id="msg"></div>

  <div class="next fade in"><a href="nerds">← back to nerds</a></div>
</main>

<footer>✈ click anywhere to send a plane</footer>

<script src="site.js"></script>
<script>
let PUZZLES = [];
let puzzle = null;
let tiles = [];      // [{word, groupIdx}]
let selected = [];   // words currently selected
let found = [];      // groupIdx already solved
let mistakes = 0;
const MAX_MISTAKES = 4;

async function loadData() {
  const r = await fetch('data/connections-data.json');
  PUZZLES = await r.json();
}

function pickPuzzle() {
  const idx = Math.floor(Math.random() * PUZZLES.length);
  return PUZZLES[idx];
}

function startPuzzle() {
  puzzle = pickPuzzle();
  tiles = [];
  puzzle.groups.forEach((g, gi) => g.words.forEach(w => tiles.push({ word: w, groupIdx: gi })));
  shuffleArray(tiles);
  selected = [];
  found = [];
  mistakes = 0;
  render();
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function render() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  tiles.forEach(t => {
    const el = document.createElement('div');
    el.className = 'tile' + (found.includes(t.groupIdx) ? ' gone' : '') + (selected.includes(t.word) ? ' sel' : '');
    el.textContent = t.word;
    el.addEventListener('click', () => toggleTile(t.word));
    board.appendChild(el);
  });
  for (let i = 0; i < MAX_MISTAKES; i++) {
    document.getElementById('d' + i).classList.toggle('used', i < mistakes);
  }
  document.getElementById('submitBtn').disabled = selected.length !== 4;
  document.getElementById('deselectBtn').disabled = selected.length === 0;
}

function toggleTile(word) {
  if (selected.includes(word)) {
    selected = selected.filter(w => w !== word);
  } else if (selected.length < 4) {
    selected.push(word);
  }
  render();
}

function shuffleBoard() {
  shuffleArray(tiles);
  render();
}

function deselectAll() {
  selected = [];
  render();
}

function showMsg(text, cls) {
  const m = document.getElementById('msg');
  m.textContent = text;
  m.className = 'msg show ' + (cls || '');
  if (cls !== 'win' && cls !== 'lose') setTimeout(() => m.classList.remove('show'), 1600);
}

function submit() {
  if (selected.length !== 4) return;
  const groupIdx = tiles.find(t => t.word === selected[0]).groupIdx;
  const allSame = selected.every(w => tiles.find(t => t.word === w).groupIdx === groupIdx);

  if (allSame) {
    found.push(groupIdx);
    revealFound(groupIdx);
    selected = [];
    if (found.length === 4) {
      setTimeout(() => showMsg('solved it. nicely played.', 'win'), 500);
    }
    render();
  } else {
    mistakes++;
    const boardTiles = [...document.querySelectorAll('.tile')];
    selected.forEach(w => {
      const idx = tiles.findIndex(t => t.word === w);
      const el = boardTiles[idx];
      if (el) { el.classList.add('wrong'); setTimeout(() => el.classList.remove('wrong'), 400); }
    });
    render();
    if (mistakes >= MAX_MISTAKES) {
      revealAllRemaining();
      setTimeout(() => showMsg('out of guesses — here\'s the answer.', 'lose'), 500);
    } else {
      showMsg('not quite.', '');
    }
  }
}

function revealFound(groupIdx) {
  const area = document.getElementById('foundArea');
  const g = puzzle.groups[groupIdx];
  const row = document.createElement('div');
  row.className = 'foundrow g' + g.level;
  row.innerHTML = `<div class="flabel">${g.label}</div>` + g.words.map(w => `<span class="fword">${w}</span>`).join('');
  area.appendChild(row);
}

function revealAllRemaining() {
  puzzle.groups.forEach((g, gi) => {
    if (!found.includes(gi)) { found.push(gi); revealFound(gi); }
  });
  render();
}

document.getElementById('shuffleBtn').addEventListener('click', shuffleBoard);
document.getElementById('deselectBtn').addEventListener('click', deselectAll);
document.getElementById('submitBtn').addEventListener('click', submit);
document.getElementById('newBtn').addEventListener('click', () => {
  document.getElementById('foundArea').innerHTML = '';
  document.getElementById('msg').className = 'msg';
  startPuzzle();
});

loadData().then(startPuzzle);
</script>
</body>
</html>
