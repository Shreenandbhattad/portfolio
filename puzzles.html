<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>puzzles · Shreenand Bhattad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link rel="stylesheet" href="style.css">
<style>
main{max-width:900px}
.nerdbadge{position:fixed;top:20px;right:clamp(20px,4vw,52px);z-index:11;display:flex;align-items:center;gap:10px;
  background:var(--tile-3);border-radius:999px;padding:8px 16px 8px 10px;box-shadow:0 8px 20px rgba(122,92,28,.18);
  opacity:0;transform:translateY(-8px) scale(.94);animation:badgein .6s ease .3s forwards}
@keyframes badgein{to{opacity:1;transform:none}}
.nerdbadge .face{font-size:1.35rem;line-height:1;animation:badgewiggle 3.2s ease-in-out infinite}
@keyframes badgewiggle{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}
.nerdbadge .nv{font-weight:800;font-size:1rem;color:var(--tile-3-ink);font-variant-numeric:tabular-nums;line-height:1.1}
.nerdbadge .nk{font-size:.6rem;letter-spacing:.08em;text-transform:uppercase;color:var(--tile-3-ink);opacity:.7}
body.night .nerdbadge{filter:brightness(.85) saturate(.9)}
@media(max-width:520px){.nerdbadge{top:14px;padding:6px 12px 6px 8px}.nerdbadge .face{font-size:1.1rem}.nerdbadge .nv{font-size:.88rem}}
</style>
</head>
<body>

<div class="sky" id="sky"></div>

<nav>
  <a class="home" href="index">Shreenand</a>
  <div class="pages">
    <a href="about">about</a>
    <a href="work">work</a>
    <a href="projects">projects</a>
    <a href="play">play</a>
    <a href="guestbook">guestbook</a>
    <a href="contact">say hi</a>
  </div>
</nav>

<div class="nerdbadge fade in" id="nerdBadge" title="your nerd score, earned by solving crosswords">
  <span class="face">🤓</span>
  <div>
    <div class="nv" id="nerdScoreVal">0</div>
    <div class="nk">nerd score</div>
  </div>
</div>

<main>
  <h1 class="page fade in"><em>puzzles</em></h1>
  <p class="sub fade in">a mini crossword.</p>

  <div class="cardgrid">
    <a class="card fade" href="crossword">
      <h3>Mini crossword ✏️<span>→</span></h3>
      <p>A proper 5×5, hand-built and fully interlocking. Global, India-themed, or easy ones for a gentler start.</p>
    </a>
  </div>

  <div class="next fade in"><a href="play">← back to play</a></div>
</main>

<footer>✈ click anywhere to send a plane</footer>

<script src="site.js"></script>
<script>
(function () {
  try {
    const raw = localStorage.getItem('nerds_crossword_stats');
    const stats = raw ? JSON.parse(raw) : null;
    const score = stats && typeof stats.score === 'number' ? stats.score : 0;
    document.getElementById('nerdScoreVal').textContent = score;
  } catch (e) {}
})();
</script>
</body>
</html>
