main{max-width:920px}

.modeswitch{display:flex;gap:6px}
.modebtn{border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:999px;padding:6px 14px;

.modebtn:hover{color:var(--ink);border-color:var(--faint)}
.modebtn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

body.night .modebtn.on{background:#e8e6e0;color:#232838}
.newbtn{border:1px solid var(--line);background:transparent;color:var(--soft);border-radius:999px;padding:6px 14px;
  font-family:var(--sans);font-size:.78rem;cursor:pointer;transition:all .25s}
.newbtn:hover{color:var(--ink);border-color:var(--faint)}
body.night .newbtn{border-color:rgba(255,255,255,.16);color:#a8a49b}

/* ---------------- stats strip ---------------- */
.statsrow{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 20px}

.statchip.timer .sv{color:#5a8a52}

/* ---------------- side-by-side layout ---------------- */
.xlayout{display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:start;margin:10px 0 18px}

.xwrap{display:flex;flex-direction:column;align-items:center}

.xcell{position:relative;width:52px;height:52px;background:#fffdf9;display:flex;align-items:center;justify-content:center}

.xcell.active input{background:#eef3ec}
body.night .xcell.active input{background:rgba(143,174,126,.22)}
.xcell.inword input{background:#f7f9f5}
body.night .xcell.inword input{background:rgba(143,174,126,.1)}
.xcell.correct input{background:#e4f0df;color:#3a5f36}
body.night .xcell.correct input{background:rgba(143,174,126,.25);color:#a8c9a0}
.xcell.wrong input{background:#faeaea;color:#a4454f}
body.night .xcell.wrong input{background:rgba(194,85,98,.2);color:#e0a3aa}
.xnum{position:absolute;top:2px;left:4px;font-size:.55rem;font-weight:700;color:var(--soft);pointer-events:none}
body.night .xnum{color:#8b8880}
@media(max-width:480px){.xcell{width:16vw;height:16vw;max-width:58px;max-height:58px}}

.clueline{text-align:left;min-height:44px;display:flex;align-items:center;gap:10px;
  font-family:var(--sans);font-size:1.05rem;font-weight:600;color:var(--ink);margin-bottom:14px;padding:12px 16px;
  background:#f1ede4;border-radius:12px}
body.night .clueline{color:#e8e6e0;background:#2e3345}
.clueline .dir{font-weight:800;color:#5a8a52;flex-shrink:0}
body.night .clueline .dir{color:#a8c9a0}
.cluebtn{background:none;border:1px solid var(--line);color:var(--soft);border-radius:999px;width:28px;height:28px;
  font-size:.8rem;cursor:pointer;flex-shrink:0;transition:all .2s;margin-left:auto}
.cluebtn:hover{color:var(--ink);border-color:var(--faint)}
body.night .cluebtn{border-color:rgba(255,255,255,.16);color:#a8a49b}

.xcontrols{display:flex;gap:10px;margin-bottom:8px}
.actbtn{border:1.5px solid var(--ink);background:transparent;color:var(--ink);border-radius:999px;padding:9px 18px;
  font-family:var(--sans);font-weight:600;font-size:.8rem;cursor:pointer;transition:all .2s}
.actbtn:hover{background:var(--ink);color:var(--paper)}
body.night .actbtn{border-color:#e8e6e0;color:#e8e6e0}
body.night .actbtn:hover{background:#e8e6e0;color:#232838}

.winmsg{font-size:1.05rem;font-weight:700;color:#5a8a52;margin:14px 0;opacity:0;transition:opacity .4s;transform:translateY(-6px)}
.winmsg.show{opacity:1;transform:none}
body.night .winmsg{color:#a8c9a0}

.cluelist{display:grid;grid-template-columns:1fr 1fr;gap:0 24px;font-size:.92rem;color:var(--soft)}
.cluelist h4{grid-column:1/-1;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 0 6px}
.cluelist h4:first-child{margin-top:0}
.cluelist .crow{padding:4px 0;cursor:pointer;transition:color .2s;line-height:1.4}
.cluelist .crow:hover{color:var(--ink)}
.cluelist .crow.active{color:#5a8a52;font-weight:700}
.cluelist .crow.done{text-decoration:line-through;opacity:.5}
body.night .cluelist .crow.active{color:#a8c9a0}
body.night .cluelist{color:#a8a49b}
@media(max-width:480px){.cluelist{grid-template-columns:1fr}}

/* ---------------- history panel ---------------- */
.histwrap{margin-top:36px}
.histwrap h2{margin:0 0 14px}
.histrow{display:flex;justify-content:space-between;font-size:.85rem;color:var(--soft);padding:8px 0;border-bottom:1px solid var(--line)}
.histrow:first-of-type{border-top:1px solid var(--line)}
.histrow b{color:var(--ink);font-weight:600}
body.night .histrow{border-color:rgba(255,255,255,.1);color:#a8a49b}
body.night .histrow b{color:#e8e6e0}
.emptyhist{font-size:.85rem;color:var(--faint);padding:14px 0}
</style>

<main>
  <div class="gamehead">

<script src="site.js"></script>
<script>
let DATA = { global: [], india: [] };
let mode = 'global';
let puzzle = null;
let size = 5;
let cellEls = [];       // [r][c] -> input element
let cellSlots = [];      // [r][c] -> {A: slotIdx|null, D: slotIdx|null}
let slots = [];          // flat list: {dir, row, col, len, answer, clue, number}
let curSlot = 0;
let curCellInSlot = 0;
let solved = false;
let startTime = null;
let timerHandle = null;
let elapsedMs = 0;

/* ================= stats: localStorage, per-browser ================= */
const STATS_KEY = 'nerds_crossword_stats';
function loadStats() {
  try {
    const raw = localStorage.getItem(STATS_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { solved: 0, score: 0, history: [], bestTimeMs: {} };
}
function saveStats(s) {
  try { localStorage.setItem(STATS_KEY, JSON.stringify(s)); } catch (e) {}
}
let STATS = loadStats();

function renderStatsChips() {
  document.getElementById('statSolved').textContent = STATS.solved;
}

function renderHistory() {
  const box = document.getElementById('histList');
  if (!STATS.history.length) {
    box.innerHTML = '<div class="emptyhist">solve one and it\'ll show up here.</div>';
    return;
  }
  box.innerHTML = STATS.history.slice(0, 10).map(h => `
    <div class="histrow">
      <span><b>${h.title}</b> · ${h.mode === 'india' ? '🇮🇳' : '🌍'}</span>
      <span>${formatTime(h.timeMs)} · +${h.points} pts</span>
    </div>`).join('');
}

function formatTime(ms) {
  const s = Math.floor(ms / 1000);
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return m + ':' + String(rem).padStart(2, '0');
}

function tickTimer() {
  if (startTime === null || solved) return;
  elapsedMs = Date.now() - startTime;
  document.getElementById('statTimer').textContent = formatTime(elapsedMs);
}

function startTimerIfNeeded() {
  if (startTime !== null) return;
  startTime = Date.now();
  timerHandle = setInterval(tickTimer, 250);
}

function stopTimer() {
  if (timerHandle) clearInterval(timerHandle);
  timerHandle = null;
}

/* ================= data + grid setup ================= */
async function loadData() {
  const r = await fetch('data/crossword-data.json');
  DATA = await r.json();
}

function buildSlots(p) {
  const list = [];
  const numbering = {}; // "r,c" -> number
  let n = 1;
  const grid2d = [];
  for (let r = 0; r < p.size; r++) grid2d.push(p.grid.slice(r * p.size, (r + 1) * p.size));

  function needsNumber(r, c) {
    if (grid2d[r][c] === '#') return false;
    const startsAcross = (c === 0 || grid2d[r][c - 1] === '#') && c + 1 < p.size && grid2d[r][c + 1] !== '#';
    const startsDown = (r === 0 || grid2d[r - 1][c] === '#') && r + 1 < p.size && grid2d[r + 1][c] !== '#';
    return startsAcross || startsDown;
  }
  for (let r = 0; r < p.size; r++) {
    for (let c = 0; c < p.size; c++) {
      if (needsNumber(r, c)) numbering[r + ',' + c] = n++;
    }
  }
  p.across.forEach(e => list.push({ dir: 'A', row: e.row, col: e.col, len: e.answer.length, answer: e.answer.toUpperCase(), clue: e.clue, number: numbering[e.row + ',' + e.col] }));
  p.down.forEach(e => list.push({ dir: 'D', row: e.row, col: e.col, len: e.answer.length, answer: e.answer.toUpperCase(), clue: e.clue, number: numbering[e.row + ',' + e.col] }));
  return { list, grid2d, numbering };
}

function startPuzzle() {
  stopTimer();
  startTime = null;
  elapsedMs = 0;
  document.getElementById('statTimer').textContent = '0:00';

  const bank = DATA[mode];
  puzzle = bank[Math.floor(Math.random() * bank.length)];
  size = puzzle.size;
  const built = buildSlots(puzzle);
  slots = built.list;
  const grid2d = built.grid2d;

  cellSlots = Array.from({ length: size }, () => Array(size).fill(null).map(() => ({ A: null, D: null })));
  slots.forEach((s, si) => {
    for (let i = 0; i < s.len; i++) {
      const r = s.dir === 'A' ? s.row : s.row + i;
      const c = s.dir === 'A' ? s.col + i : s.col;
      cellSlots[r][c][s.dir] = si;
    }
  });

  const grid = document.getElementById('xgrid');
  grid.style.gridTemplateColumns = `repeat(${size}, 1fr)`;
  grid.innerHTML = '';
  cellEls = Array.from({ length: size }, () => Array(size).fill(null));
  for (let r = 0; r < size; r++) {
    for (let c = 0; c < size; c++) {
      const cell = document.createElement('div');
      if (grid2d[r][c] === '#') {
        cell.className = 'xcell black';
      } else {
        cell.className = 'xcell';
        const num = built.numbering[r + ',' + c];
        if (num) { const nm = document.createElement('div'); nm.className = 'xnum'; nm.textContent = num; cell.appendChild(nm); }
        const inp = document.createElement('input');
        inp.maxLength = 1;
        inp.dataset.r = r; inp.dataset.c = c;
        inp.addEventListener('focus', () => onFocusCell(r, c));
        inp.addEventListener('input', () => onType(r, c));
        inp.addEventListener('keydown', e => onKey(e, r, c));
        cell.appendChild(inp);
        cellEls[r][c] = inp;
      }
      grid.appendChild(cell);
    }
  }

  curSlot = slots.findIndex(s => s.dir === 'A');
  curCellInSlot = 0;
  solved = false;
  document.getElementById('winMsg').className = 'winmsg';
  renderClueLine();
  renderClueList();
  focusCurrent();
}

function slotCells(s) {
  const arr = [];
  for (let i = 0; i < s.len; i++) {
    const r = s.dir === 'A' ? s.row : s.row + i;
    const c = s.dir === 'A' ? s.col + i : s.col;
    arr.push([r, c]);
  }
  return arr;
}

function slotIsFull(s) {
  return slotCells(s).every(([r, c]) => cellEls[r][c].value);
}

function highlightSlot() {
  document.querySelectorAll('.xcell').forEach(el => el.classList.remove('active', 'inword'));
  const s = slots[curSlot];
  const cells = slotCells(s);
  cells.forEach(([r, c], i) => {
    if (!cellEls[r][c]) return;
    cellEls[r][c].closest('.xcell').classList.add(i === curCellInSlot ? 'active' : 'inword');
  });
}

function renderClueLine() {
  const s = slots[curSlot];
  document.getElementById('clueDir').textContent = (s.number || '') + (s.dir === 'A' ? 'A' : 'D');
  document.getElementById('clueText').textContent = s.clue;
  highlightSlot();
  renderClueList();
}

function focusCurrent() {
  const s = slots[curSlot];
  const cells = slotCells(s);
  const [r, c] = cells[curCellInSlot] || cells[0];
  if (cellEls[r][c]) cellEls[r][c].focus();
}

function onFocusCell(r, c) {
  const cs = cellSlots[r][c];
  // prefer keeping current direction if this cell belongs to it, else switch
  const s = slots[curSlot];
  let slotIdx = (s && cs[s.dir] !== null) ? cs[s.dir] : (cs.A !== null ? cs.A : cs.D);
  if (slotIdx === null) return;
  curSlot = slotIdx;
  const cells = slotCells(slots[curSlot]);
  curCellInSlot = cells.findIndex(([rr, cc]) => rr === r && cc === c);
  renderClueLine();
}

/* find the next slot (in clue order) that still has an empty cell, wrapping around */
function nextUnfilledSlot(fromIdx) {
  for (let step = 1; step <= slots.length; step++) {
    const idx = (fromIdx + step) % slots.length;
    if (!slotIsFull(slots[idx])) return idx;
  }
  return null; // everything's full
}

function onType(r, c) {
  const inp = cellEls[r][c];
  inp.value = inp.value.toUpperCase().replace(/[^A-Z]/g, '').slice(-1);
  inp.closest('.xcell').classList.remove('correct', 'wrong');
  startTimerIfNeeded();

  if (inp.value) {
    const cells = slotCells(slots[curSlot]);
    const idx = cells.findIndex(([rr, cc]) => rr === r && cc === c);
    if (idx > -1 && idx < cells.length - 1) {
      // more letters to go in this word: just advance within it
      const [nr, nc] = cells[idx + 1];
      curCellInSlot = idx + 1;
      cellEls[nr][nc].focus();
    } else if (idx === cells.length - 1 && slotIsFull(slots[curSlot])) {
      // word just got completed (right or wrong, doesn't matter yet) — jump onward
      const next = nextUnfilledSlot(curSlot);
      if (next !== null) {
        curSlot = next;
        curCellInSlot = 0;
        renderClueLine();
        focusCurrent();
      } else {
        renderClueLine();
      }
    }
  }
  checkWin();
}

function onKey(e, r, c) {
  if (e.key === 'Backspace' && !cellEls[r][c].value) {
    const cells = slotCells(slots[curSlot]);
    const idx = cells.findIndex(([rr, cc]) => rr === r && cc === c);
    if (idx > 0) {
      const [pr, pc] = cells[idx - 1];
      curCellInSlot = idx - 1;
      cellEls[pr][pc].focus();
    }
  } else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    const dr = e.key === 'ArrowDown' ? 1 : e.key === 'ArrowUp' ? -1 : 0;
    const dc = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0;
    let nr = r + dr, nc = c + dc;
    if (nr >= 0 && nr < size && nc >= 0 && nc < size && cellEls[nr][nc]) cellEls[nr][nc].focus();
  } else if (e.key === 'Tab') {
    e.preventDefault();
    switchClue(e.shiftKey ? -1 : 1);
  }
}

function switchClue(delta) {
  curSlot = (curSlot + delta + slots.length) % slots.length;
  curCellInSlot = 0;
  renderClueLine();
  focusCurrent();
}

function renderClueList() {
  const box = document.getElementById('clueList');
  box.innerHTML = '<h4>across</h4>';
  slots.forEach((s, si) => {
    if (s.dir !== 'A') return;
    const row = document.createElement('div');
    row.className = 'crow' + (si === curSlot ? ' active' : '') + (slotIsFull(s) ? ' done' : '');
    row.textContent = (s.number || '') + '. ' + s.clue;
    row.addEventListener('click', () => { curSlot = si; curCellInSlot = 0; renderClueLine(); focusCurrent(); });
    box.appendChild(row);
  });
  const downHead = document.createElement('h4'); downHead.textContent = 'down';
  box.appendChild(downHead);
  slots.forEach((s, si) => {
    if (s.dir !== 'D') return;
    const row = document.createElement('div');
    row.className = 'crow' + (si === curSlot ? ' active' : '') + (slotIsFull(s) ? ' done' : '');
    row.textContent = (s.number || '') + '. ' + s.clue;
    row.addEventListener('click', () => { curSlot = si; curCellInSlot = 0; renderClueLine(); focusCurrent(); });
    box.appendChild(row);
  });
}

function todayKey() {
  return new Date().toISOString().slice(0, 10);
}

function recordSolve() {
  STATS.solved += 1;

  // nerd score: base points plus a bonus for speed
  const seconds = Math.round(elapsedMs / 1000);
  const speedBonus = Math.max(0, 60 - seconds); // faster than a minute earns extra
  const points = 20 + speedBonus;
  STATS.score += points;

  STATS.history.unshift({ title: puzzle.title, mode, timeMs: elapsedMs, points, date: todayKey() });
  STATS.history = STATS.history.slice(0, 30);

  const bestKey = mode;
  if (!STATS.bestTimeMs[bestKey] || elapsedMs < STATS.bestTimeMs[bestKey]) {
    STATS.bestTimeMs[bestKey] = elapsedMs;
  }

  saveStats(STATS);
  renderStatsChips();
  renderHistory();
}

function checkWin() {
  let allFilled = true, allCorrect = true;
  slots.forEach(s => {
    slotCells(s).forEach(([r, c], i) => {
      const v = cellEls[r][c].value;
      if (!v) allFilled = false;
      if (v !== s.answer[i]) allCorrect = false;
    });
  });
  if (allFilled && allCorrect && !solved) {
    solved = true;
    stopTimer();
    document.getElementById('statTimer').textContent = formatTime(elapsedMs);
    document.querySelectorAll('.xcell:not(.black)').forEach(el => el.classList.remove('wrong'));
    document.querySelectorAll('.xcell:not(.black)').forEach(el => el.classList.add('correct'));
    const m = document.getElementById('winMsg');
    m.textContent = `solved in ${formatTime(elapsedMs)} 🎉`;
    m.classList.add('show');
    recordSolve();
  }
}

function checkNow() {
  for (let r = 0; r < size; r++) for (let c = 0; c < size; c++) {
    if (!cellEls[r][c]) continue;
    const v = cellEls[r][c].value;
    const cellDiv = cellEls[r][c].closest('.xcell');
    if (!v) { cellDiv.classList.remove('correct', 'wrong'); continue; }
    const cs = cellSlots[r][c];
    const slotIdx = cs.A !== null ? cs.A : cs.D;
    const s = slots[slotIdx];
    const cells = slotCells(s);
    const idx = cells.findIndex(([rr, cc]) => rr === r && cc === c);
    const correct = s.answer[idx] === v;
    cellDiv.classList.toggle('correct', correct);
    cellDiv.classList.toggle('wrong', !correct);
  }
}

function revealAll() {
  slots.forEach(s => {
    slotCells(s).forEach(([r, c], i) => { cellEls[r][c].value = s.answer[i]; });
  });
  document.querySelectorAll('.xcell:not(.black)').forEach(el => { el.classList.remove('wrong'); el.classList.add('correct'); });
  solved = true;
  stopTimer();
  const m = document.getElementById('winMsg');
  m.textContent = 'here you go.';
  m.classList.add('show');
  renderClueList();
}

function clearAll() {
  document.querySelectorAll('.xcell input').forEach(inp => inp.value = '');
  document.querySelectorAll('.xcell').forEach(el => el.classList.remove('correct', 'wrong'));
  solved = false;
  stopTimer();
  startTime = null;
  elapsedMs = 0;
  document.getElementById('statTimer').textContent = '0:00';
  document.getElementById('winMsg').className = 'winmsg';
  renderClueList();
}

document.getElementById('prevClue').addEventListener('click', () => switchClue(-1));
document.getElementById('nextClue').addEventListener('click', () => switchClue(1));
document.getElementById('checkBtn').addEventListener('click', checkNow);
document.getElementById('revealBtn').addEventListener('click', revealAll);
document.getElementById('clearBtn').addEventListener('click', clearAll);
document.getElementById('newBtn').addEventListener('click', startPuzzle);
document.getElementById('modeGlobal').addEventListener('click', () => {
  mode = 'global';
  document.getElementById('modeGlobal').classList.add('on');
  document.getElementById('modeIndia').classList.remove('on');
  startPuzzle();
});
document.getElementById('modeIndia').addEventListener('click', () => {
  mode = 'india';
  document.getElementById('modeIndia').classList.add('on');
  document.getElementById('modeGlobal').classList.remove('on');
  startPuzzle();
});

renderStatsChips();
renderHistory();
loadData().then(startPuzzle);
</script>
</body>
</html>
