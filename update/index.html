<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shreenand Bhattad · desktop edition</title>
<meta name="description" content="Shreenand Bhattad's portfolio, rebuilt as a tiny desktop. Machine learning, data, and the systems that hold them together.">
<meta name="theme-color" content="#e5e7e0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>
<body>

    <symbol id="i-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></g></symbol>
    <symbol id="i-brief" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M3 13h18"/></g></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="m8 7-5 5 5 5m8-10 5 5-5 5M14 5l-4 14"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M8 10.5v4M6 12.5h4M15.5 11.5h.01M17.5 13.5h.01"/></g></symbol>

    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.500"/><path d="m16 16 4.500 4.500"/></g></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.200" stroke-linecap="round" d="m6 6 12 12M18 6 6 18"/></symbol>

</svg>

<div id="wall">
  <div class="sun"></div>
  <svg viewBox="0 0 1200 300" preserveAspectRatio="none" id="grass"></svg>
</div>

<header id="bar">
  <a class="mark" href="#home" title="home">SB</a>
  <nav id="nav">
    <button data-open="home">Home</button>
    <button data-open="about">About</button>
    <button data-open="work">Work</button>
    <button data-open="projects">Projects</button>
    <button data-open="play">Play</button>
    <button data-open="contact">Contact</button>
  </nav>
  <span class="sp"></span>
  <span id="clock"></span>
  <a class="cta" href="#contact" data-open="contact">Say hi</a>
  <button class="ibtn" id="searchBtn" title="Search (⌘K)" aria-label="Search"><svg><use href="#i-search"/></svg></button>
</header>

<aside class="icons l" id="iconsL"></aside>
<aside class="icons r" id="iconsR"></aside>
<div id="wins"></div>

<div id="spot" role="dialog" aria-label="Search">
  <div class="panel">
    <input id="spotIn" placeholder="Jump to… work, projects, a game, résumé" autocomplete="off">
    <div class="res" id="spotRes"></div>
  </div>
</div>

<div id="toast">
  <button id="toastX" aria-label="Dismiss">×</button>
  <b>Legally-required cookie banner</b>
  <p>This site sets no cookies and loads no trackers. The only thing it remembers, in your browser, is whether you closed this box.</p>
  <p>No data goes to a third party. Nobody is asking you to accept anything.</p>
</div>

<script src="app.js"></script>
</body>
</html>
